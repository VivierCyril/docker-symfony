services:
  php:
    container_name: php8-symfony
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/project
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/project
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    
  db:
    image: mysql:8.0
    container_name: db-api
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: api
      MYSQL_USER: apiroot
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - db_data:/var/lib/mysql

  phpma:
    image: phpmyadmin
    container_name: phpmyadmin-api
    restart: always
    ports:
      - 9000:80
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: db
      PMA_USER: apiroot
      PMA_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret

volumes:
  db_data:

